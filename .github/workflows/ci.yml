name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  KMP_DUPLICATE_LIB_OK: "TRUE"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Build real evaluation corpus (fetches SQuAD dev set)
        run: python data/build_corpus.py

      - name: Run test suite (fast, deterministic, no network)
        run: pytest tests/ -v --tb=short --ignore=tests/test_sentence_embedder_live.py

      - name: Run full evaluation report (default embedder)
        run: python -m verityrag.eval

  real-embeddings-live-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run live SentenceTransformerEmbedder test (real model download)
        run: pytest tests/test_sentence_embedder_live.py -v